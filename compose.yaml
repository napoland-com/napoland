# napoland: the game (server + web client) and its PostgreSQL database.
#   docker compose up -d --build     build and start; open http://localhost:8080 (or http://<this PC's IP>:8080 on a phone)
#   docker compose logs -f game      server logs (one JSON object per line)
#   docker compose down              stop, keeping players (add -v to wipe the database)
# Settings live in .env (see .env.example).
name: napoland

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: napoland
      POSTGRES_USER: napoland
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U napoland -d napoland"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  game:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: napoland-game:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://napoland:${POSTGRES_PASSWORD}@db:5432/napoland
      WEATHER: ${WEATHER:-cycle}
      # For testing on this PC, where every tab and test bot shares one address (production keeps 20 and 10).
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-1000}
      NEW_PLAYERS_PER_IP_PER_HOUR: ${NEW_PLAYERS_PER_IP_PER_HOUR:-1000}
      # Sign-in: dev mode takes an email without a code, so each tab can be someone else. The image
      # runs with NODE_ENV=production, which refuses dev mode unless ALLOW_DEV_AUTH=1: never on a
      # public server. AUTH_MODE=supabase with the two values below tries the real sign-in here.
      AUTH_MODE: ${AUTH_MODE:-dev}
      ALLOW_DEV_AUTH: "1"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${GAME_PORT:-8080}:8080"
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  db-data:
